#
# Пороги покрытия для scripts/covergate.py: «префикс пути от корня репозитория:
# минимум строк (операторов Go), %». Префикс каталога оканчивается на «/»; процент
# считается по сумме всех файлов с этим префиксом. Если по записи нет данных в
# профиле — это ошибка, а не пропуск.
#
# Пример (записи добавляют фазы, которые создают новые пакеты):
#   core/internal/traffic/: 90
#   core/internal/api/agent_table.go: 85
#   ui/src/lib/newmodule.ts: 90
#
# Подмножество YAML: раздел thresholds, вложенные «префикс: число», комментарии «#».
thresholds:
  core/internal/traffic/: 90 # T-79: модель, счётчик скоростей и подставной источник
