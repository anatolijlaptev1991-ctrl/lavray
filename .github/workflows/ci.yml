# ============================================================================
# ci.yml — главный репозиторий lavray: контракт, дизайн, пресеты
# ============================================================================
# Подмножество черновика docs/stage3/ci/lavray.yml, исполнимое на текущем
# состоянии (контракт + дизайн + пресеты). Джобы go/rust/node/ui подключаются
# по мере появления кода W1–W8 (core-port-plan). Правила: permissions read
# (LNB-30), пин ОС раннера, без секретов.
name: lavray-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: lavray-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # --------------------------------------------------------------------------
  # proto: контракт UI<->ядро (proto/lavray.proto; buf.yaml — пин конфига)
  # --------------------------------------------------------------------------
  proto:
    runs-on: ubuntu-24.04 # ПИН ОС раннера: обновлять сознательно
    steps:
      - uses: actions/checkout@v4 # при переходе в прод пинить по SHA
      - uses: bufbuild/buf-setup-action@v1
        with:
          buf_version: "1.75.0" # пин версии buf
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf format (проверка, без записи)
        working-directory: proto
        run: buf format -d --exit-code lavray.proto
      - name: buf build
        working-directory: proto
        run: buf build -o /dev/null
      # breaking против main включается после первого мержа контракта
      # (baseline) — отдельным коммитом, чтобы не блокировать начальный пуш.

  # --------------------------------------------------------------------------
  # design: приёмочные скрипты, не требующие браузера (полный a11y_sweep и
  # kbd_probe с Playwright подключаются в W-пакетах с UI-кодом)
  # --------------------------------------------------------------------------
  design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - name: Установка Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: "i18n_check (0 ошибок / 0 предупреждений)"
        run: python design/tools/i18n_check.py
      - name: token_contrast (все PASS)
        run: python design/tools/token_contrast.py

  # --------------------------------------------------------------------------
  # presets: встроенные пресеты (дымовая проверка схемы; golden-тесты Go — W3)
  # --------------------------------------------------------------------------
  presets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Пресеты: JSON валиден, обязательные поля, 5 языков"
        run: |
          python - <<'EOF'
          import json, glob, sys
          langs = {"ru", "zh", "en", "es", "de"}
          ok = True
          files = [f for f in glob.glob("presets/*.json") if not f.endswith(".source.json")]
          assert files, "встроенные пресеты не найдены"
          for f in sorted(files):
              d = json.load(open(f, encoding="utf-8"))
              miss = {"$schema","id","name","builtin","revision","version","description","dns","routing"} - set(d)
              if miss:
                  print(f"FAIL {f}: нет полей {sorted(miss)}"); ok = False; continue
              if d["builtin"] is not True:
                  print(f"FAIL {f}: builtin != true"); ok = False
              if not isinstance(d["revision"], int) or d["revision"] < 1:
                  print(f"FAIL {f}: revision должен быть int >= 1"); ok = False
              dl = set(d["description"])
              if dl != langs:
                  print(f"FAIL {f}: description: языки {sorted(dl)} != {sorted(langs)}"); ok = False
              print(f"ok {f}: rev {d['revision']}")
          sys.exit(0 if ok else 1)
          EOF

  # --------------------------------------------------------------------------
  # go: ядро core/ (модель, хранилище, импортёр). Полная матрица core-гейтов
  # (sing-box, golden G01+) подключается в W4–W8.
  # --------------------------------------------------------------------------
  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt (форматирование)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -timeout 120s
      - name: "Страж: clash_api в ядре запрещён, пока форк не пропатчен (T-47)"
        run: go test ./internal/buildtags/ -run TestClashAPITagIsForbiddenUntilForkIsPatched -count=1
      - name: "go test: sing-box check golden (тег singbox_check)"
        # Полная проверка golden-эталонов реальным sing-box (форк 35f3fd0):
        # box.New + Close. Локально без сети к прокси — выключена тегом;
        # CI-сеть качает форк через proxy.golang.org (публичное зеркало).
        # D-01: теги ядра (with_quic/with_gvisor/with_utls) — из core/BUILD_TAGS,
        # иначе hysteria2/TUIC не собираются и проверка молча урезается; с этими
        # тегами «is not included in this build» в тесте — провал.
        run: |
          TAGS="$(tr -d '[:space:]' < BUILD_TAGS)"
          test -n "$TAGS"
          go test -tags "singbox_check,$TAGS" ./internal/cfgbuild/ -run TestGoldenSingBoxCheck -count=1 -timeout 300s
        env:
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
      - name: go build
        run: go build ./...

  # --------------------------------------------------------------------------
  # go-race: гонки в новом конкурентном коде журнала и батчей теста. Весь
  # internal/api под -race не гоняем: старые гонки вне этого PR.
  # --------------------------------------------------------------------------
  go-race:
    runs-on: ubuntu-24.04 # ПИН ОС раннера: обновлять сознательно
    defaults:
      run:
        working-directory: core
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: go test -race (logs)
        run: go test -race -count=1 ./internal/logs/
      - name: go test -race (журнал и батчи теста в api)
        run: |
          go test -race -count=1 -tags "$(tr -d '[:space:]' < BUILD_TAGS)" ./internal/api/             -run 'TestPump|TestSubscribeRPC|TestSubscribeTailLive|TestLogLineToProto|TestOverlappingBatch|TestDisjointBatches|TestBatchAllowed|TestCoreStatus'

  # --------------------------------------------------------------------------
  # core-run: РЕАЛЬНАЯ сборка ядра с работающим sing-box (тег singbox_run).
  # Без этого «Подключиться» в приложении = NopRunner (ничего не подключает).
  # Сеть CI скачивает форк и его зависимости; локально это недостижимо (DPI).
  # --------------------------------------------------------------------------
  core-run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Зависимости раннера (форк sing-box)
        env:
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
        run: |
          go get github.com/anatolijlaptev1991-ctrl/sing-box@v1.14.2-0.20261031133806-35f3fd09bcf9 || true
          go mod tidy
      - name: Сборка с реальным раннером (теги из core/BUILD_TAGS)
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
        run: |
          # T-02: единый список тегов (singbox_run, with_quic, with_gvisor,
          # with_utls); те же теги — в shell/build.ps1, build.sh и релизе.
          TAGS="$(tr -d '[:space:]' < BUILD_TAGS)"
          test -n "$TAGS"
          go build -tags "$TAGS" -o /tmp/lavray-core ./cmd/lavray-core/
          ls -la /tmp/lavray-core
          # В бинарнике записаны ровно эти теги.
          go version -m /tmp/lavray-core | grep -F -- "-tags=$TAGS"
      - name: "Реальный раннер: туннель (T-01), REALITY/uTLS (T-02), сквозные тесты протоколов и API с настоящим ядром (0.2.1)"
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
        run: |
          TAGS="$(tr -d '[:space:]' < BUILD_TAGS)"
          go test -tags "$TAGS" ./internal/inst/ ./internal/api/ -count=1 -timeout 300s
      - name: Smoke - ядро поднимается, healthz, auth и RPC
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(mktemp -d)
          TOKEN="ci-test-token-0123456789abcdef0123"
          # T1: stdin ОБЯЗАН оставаться открытым — закрытие = «смерть
          # оболочки» (§3.2), ядро штатно выходит. Первая строка — токен.
          (echo "$TOKEN"; sleep 120) | /tmp/lavray-core serve --listen-socket 127.0.0.1:0 --data "$DATA" > /tmp/core.log 2>&1 &
          CORE_PID=$!
          READY=""
          for i in $(seq 1 80); do
            READY=$(grep -o "LAVRAY_CORE_READY tcp://[0-9.]*:[0-9]*" /tmp/core.log | head -1 || true)
            if [ -n "$READY" ]; then break; fi
            sleep 0.25
          done
          if [ -z "$READY" ]; then echo "core did not become ready"; cat /tmp/core.log; exit 1; fi
          PORT="${READY##*:}"
          echo "core listening on port $PORT"
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/healthz")
          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/lavray.v1.CoreService/GetStatus")
          BADAUTH=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer wrong" "http://127.0.0.1:$PORT/lavray.v1.CoreService/GetStatus")
          STATUS=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json"             -d "{}" "http://127.0.0.1:$PORT/lavray.v1.CoreService/GetStatus")
          echo "healthz=$HEALTH no-auth=$NOAUTH bad-auth=$BADAUTH"
          echo "status=$STATUS"
          kill $CORE_PID 2>/dev/null || true
          test "$HEALTH" = "200"
          test "$NOAUTH" = "401"
          test "$BADAUTH" = "401"
          # T2: поле state не сериализуется при дефолте (proto3 omit) —
          # проверяем реально присутствующие поля ответа.
          echo "$STATUS" | grep -q "coreVersion"

  # --------------------------------------------------------------------------
  # rust: оболочка shell/ (Tauri 2). UI собирается заранее — frontendDist
  # (../ui/dist) нужен макросу generate_context! на этапе компиляции.
  # --------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - name: Системные зависимости Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev build-essential curl wget file             libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: "UI: сборка (нужна для frontendDist)"
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: Заглушка ядра (resources ожидает binaries/lavray-core)
        run: |
          mkdir -p binaries
          if [ ! -f binaries/lavray-core ]; then
            { echo '#!/bin/sh'; echo 'exit 1'; } > binaries/lavray-core
            chmod +x binaries/lavray-core
          fi
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        run: cargo test
      - name: cargo build
        run: cargo build

  # --------------------------------------------------------------------------
  # rust-windows: код оболочки под #[cfg(windows)] (WinINET и RAS системного
  # прокси, снимок экрана GDI, Job Object, реестр) на ubuntu не компилируется
  # вовсе (T-82). Раннер одноразовый: настоящий WinINET на выдуманной записи
  # RAS разрешён (LAVRAY_CI_REAL_WININET), на ПК разработчика — никогда.
  # --------------------------------------------------------------------------
  rust-windows:
    runs-on: windows-2025 # ПИН ОС раннера: обновлять сознательно
    defaults:
      run:
        working-directory: shell
        shell: bash
    steps:
      # Репозиторий хранит LF (hygiene); без этого git на Windows выкачал бы CRLF.
      - name: git без замены переводов строк
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: "UI: сборка (нужна для frontendDist)"
        working-directory: ui
        run: |
          npm ci
          npm run build
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        env:
          LAVRAY_CI_REAL_WININET: "1"
        run: cargo test

  # --------------------------------------------------------------------------
  # node: UI (ui/, единый React для приложения и веб-панели)
  # --------------------------------------------------------------------------
  node:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Проверка сгенерированного контракта (buf + protoc-gen-es)
        run: |
          npx buf generate proto
          git diff --exit-code -- src/gen || {
            echo "::error::src/gen устарел: запустите 'npx buf generate proto' и закоммитьте"; exit 1; }
      - name: tsc --noEmit
        run: npx tsc --noEmit
      - name: eslint
        run: npx eslint .
      - name: vitest
        run: npx vitest run
      - name: vite build
        run: npm run build
      - name: "Бюджет бандла (JS до первого кадра ≤ 250 КБ gzip)"
        run: python3 ../scripts/check_bundle_budget.py

  # --------------------------------------------------------------------------
  # nft-check (T-76): golden-выводы NftRenderer (core/internal/gateway/testdata)
  # проходят `nft -c -f`: проверяются синтаксис и ядро, правила НЕ применяются.
  # Равенство рендера и golden проверяет job go (TestRenderGolden).
  # --------------------------------------------------------------------------
  nft-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nftables
          nft --version
      - name: "Системный пользователь lavray (на него ссылается meta skuid)"
        run: sudo useradd --system --no-create-home --shell /usr/sbin/nologin lavray
      - name: "Модули ядра для tproxy и fib (если они модулями)"
        run: sudo modprobe -a nf_tables nft_tproxy nft_fib nft_fib_inet nft_fib_ipv4 nft_fib_ipv6 || true
      - name: "nft -c -f для каждого golden"
        run: |
          shopt -s nullglob
          files=(core/internal/gateway/testdata/*.nft)
          test "${#files[@]}" -gt 0 || { echo "::error::golden-файлов нет"; exit 1; }
          for f in "${files[@]}"; do
            echo "::group::nft -c -f $f"
            sudo nft -c -f "$f"
            echo "::endgroup::"
          done

  # --------------------------------------------------------------------------
  # web-e2e (T-76): Playwright в Chromium против настоящего ядра с --web-bind на
  # loopback и встроенным ui/dist (тег with_webui): первичная настройка →
  # список серверов → выход → вход. Браузер ставится только здесь.
  # --------------------------------------------------------------------------
  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: "Интерфейс: npm ci, сборка, копия в core/internal/web/dist"
        run: bash scripts/build-webui.sh
      - name: "Ядро с тегом with_webui"
        working-directory: core
        env:
          CGO_ENABLED: '0'
        # Только with_webui: для входа в панель sing-box не нужен (NopRunner).
        run: |
          tags=with_webui
          go build -tags "$tags" -o ../lavray-core ./cmd/lavray-core
      - name: "Chromium для Playwright"
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: "Playwright: вход → список серверов → выход"
        working-directory: ui
        env:
          LAVRAY_CORE_BIN: ${{ github.workspace }}/lavray-core
        run: npx playwright test
      - name: "Отчёт и трассы при сбое"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-report
          path: |
            ui/playwright-report
            ui/test-results
          if-no-files-found: ignore

  # --------------------------------------------------------------------------
  # hygiene: размерная трещотка, SPDX, окончания строк LF и тесты скриптов (Ф1.0).
  # Только стандартная библиотека Python, пакеты не ставятся.
  # --------------------------------------------------------------------------
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Размерная трещотка (новый файл до 200 строк, большие не растут)"
        run: python scripts/size_ratchet.py
      - name: SPDX-заголовки
        run: python scripts/add-spdx.py --check
      - name: "README без опровергнутых и устаревших утверждений"
        run: sh scripts/check-readme-claims.sh
      - name: "RPC без интерфейса (каждый RPC вызывается в ui/src или внесён с причиной)"
        run: python scripts/rpc_usage.py
      - name: "Окончания строк: в индексе только LF"
        run: |
          # Колонка index: i/lf, i/crlf, i/mixed, i/-text (двоичные), i/none.
          bad="$(git ls-files --eol | awk -F'\t' '$1 ~ /^i\/(crlf|mixed)/ {print $2}')"
          if [ -n "$bad" ]; then
            echo "::error::CRLF в индексе, нужен LF:"
            echo "$bad"
            exit 1
          fi
      - name: Тесты скриптов (unittest)
        run: python -m unittest discover -s scripts/tests
