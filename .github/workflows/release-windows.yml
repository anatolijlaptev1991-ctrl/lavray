# release-windows.yml — сборка Windows-артефактов LAVRay (NSIS + portable ZIP).
# Запуск: тег v* или вручную. Артефакты: установщик и ZIP с ядром внутри.
name: release-windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# T-75: права по умолчанию — чтение; запись нужна только джобам, которые
# прикрепляют ассеты к релизу (build) и публикуют метаданные обновлений (sign).
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # T-57: имена ассетов задаются здесь, один раз; те же имена — в заметках
      # релиза (docs/RELEASE-NOTES-windows-v<версия>.md) и в README
      # платформенных репозиториев. Тег обязан совпасть с версией сборки.
      - name: "Версия и имена ассетов"
        shell: pwsh
        run: |
          $ver = (Get-Content shell/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$ver") {
            throw "тег $env:GITHUB_REF_NAME не равен v$ver из shell/tauri.conf.json"
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
          "SETUP_NAME=LAVRay-$ver-x64-setup.exe" >> $env:GITHUB_ENV
          "PORTABLE_NAME=LAVRay-$ver-portable-x64.zip" >> $env:GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: "UI: сборка"
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: "Теги ядра: единый список, запрет clash_api (T-02, T-47)"
        working-directory: core
        run: go test ./internal/buildtags/ -count=1

      - name: "Ядро: сборка (CGO-free)"
        working-directory: core
        env:
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
        run: |
          go mod tidy
          New-Item -ItemType Directory -Force -Path ../shell/binaries | Out-Null
          # T3 (аудит №6): БЕЗ тега singbox_run ядро без sing-box и «Подключиться»
          # не работает. go mod tidy выше уже подтянул форк.
          # T-02: теги берём из единого списка core/BUILD_TAGS (в workflow их
          # не копировать): без with_utls не запускаются REALITY и fp=, без
          # with_gvisor — TUN со стеком по умолчанию.
          $tags = (Get-Content BUILD_TAGS -Raw).Trim()
          if ($tags -eq '') { throw 'core/BUILD_TAGS пуст' }
          # T-75: версия приложения в ядре — флагом компоновщика (internal/version).
          $ld = "-s -w -X github.com/anatolijlaptev1991-ctrl/lavray/core/internal/version.Version=$env:VERSION"
          go build -tags $tags -trimpath -ldflags $ld -o ../shell/binaries/lavray-core.exe ./cmd/lavray-core/
          if ($LASTEXITCODE -ne 0) { throw 'ядро не собралось' }
          # В собранном exe записаны ровно эти теги.
          $info = (go version -m ../shell/binaries/lavray-core.exe) -join "`n"
          if (-not $info.Contains("-tags=$tags")) { throw "в lavray-core.exe нет тегов $tags" }
          Get-Item ../shell/binaries/lavray-core.exe | Select-Object Name, Length

      - name: "Оболочка: установщик NSIS"
        working-directory: shell
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles nsis

      - name: "Установщик под именем релиза"
        shell: pwsh
        run: |
          $nsis = @(Get-ChildItem 'shell\target\release\bundle\nsis' -Filter '*-setup.exe')
          if ($nsis.Count -ne 1) { throw "ожидался один установщик NSIS, найдено $($nsis.Count)" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $nsis[0].FullName "dist\$env:SETUP_NAME"

      - name: "Portable ZIP (exe + ядро + LICENSE)"
        shell: pwsh
        run: |
          $rel = 'shell\target\release'
          $dir = 'dist\LAVRay-portable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$rel\lavray-shell.exe" "$dir\LAVRay.exe"
          New-Item -ItemType Directory -Force -Path "$dir\binaries" | Out-Null
          Copy-Item 'shell\binaries\lavray-core.exe' "$dir\binaries\lavray-core.exe"
          Copy-Item 'LICENSE' "$dir\LICENSE"
          Compress-Archive -Path "$dir\*" -DestinationPath "dist\$env:PORTABLE_NAME" -Force

      - name: "Checksums SHA256"
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.exe','.zip' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAVRay-windows
          path: |
            dist/${{ env.SETUP_NAME }}
            dist/${{ env.PORTABLE_NAME }}
            dist/SHA256SUMS.txt

      - name: "Прикрепить к релизу основного репо (при теге)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ env.SETUP_NAME }}
            dist/${{ env.PORTABLE_NAME }}
            dist/SHA256SUMS.txt
          generate_release_notes: true

      # Пользователь скачивает Windows-сборку из платформенного репозитория —
      # дублируем ассеты туда же (нужен секрет PLATFORM_REPO_TOKEN: PAT с
      # правом contents:write на lavray-windows; GITHUB_TOKEN кросс-репо
      # релизы не создаёт).
      - name: "Релиз в lavray-windows (при теге, если задан токен)"
        if: startsWith(github.ref, 'refs/tags/') && env.PLATFORM_REPO_TOKEN != ''
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        shell: bash
        run: |
          repo=anatolijlaptev1991-ctrl/lavray-windows
          assets=("dist/$SETUP_NAME" "dist/$PORTABLE_NAME" dist/SHA256SUMS.txt)
          if gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --repo "$repo" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --repo "$repo" \
              --title "LAVRay $GITHUB_REF_NAME для Windows" \
              --notes-file "docs/RELEASE-NOTES-windows-v${VERSION}.md"
          fi

  # T-75: подпись метаданных обновлений. Секреты LAVRAY_TIMESTAMP_KEY,
  # LAVRAY_MANIFEST_KEY и LAVRAY_ARTIFACT_KEY лежат в Environment
  # release-signing (ревьюер — владелец; Environment ограничен тегами `v*`, см.
  # docs/UPDATE-SYSTEM.md §12.4). Секретов нет — все шаги пропускаются и джоб
  # завершается успешно: релиз выходит без meta/, клиент честно говорит
  # «обновления не настроены». Секреты нельзя проверить в job-level `if`, поэтому
  # вентиль — первый шаг; в него приходит только булево «задан ли секрет»
  # (выражение вычисляется до запуска, значение секрета в шаг не попадает).
  # Каждый ключ виден только тому шагу, который им подписывает.
  sign:
    name: "Подпись метаданных обновлений"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release-signing
    permissions:
      contents: write
    # Два релиза не подписываются одновременно: serial и gh-pages общие.
    concurrency:
      group: release-signing
      cancel-in-progress: false
    steps:
      - name: "Ключи подписи заданы?"
        id: gate
        env:
          HAVE_TIMESTAMP: ${{ secrets.LAVRAY_TIMESTAMP_KEY != '' }}
          HAVE_MANIFEST: ${{ secrets.LAVRAY_MANIFEST_KEY != '' }}
          HAVE_ARTIFACT: ${{ secrets.LAVRAY_ARTIFACT_KEY != '' }}
        run: |
          if [ "$HAVE_TIMESTAMP" = true ] && [ "$HAVE_MANIFEST" = true ] && [ "$HAVE_ARTIFACT" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Подпись обновлений пропущена::секреты LAVRAY_TIMESTAMP_KEY, LAVRAY_MANIFEST_KEY, LAVRAY_ARTIFACT_KEY окружения release-signing не заданы: meta/ не публикуется"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.enabled == 'true'
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/download-artifact@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          name: LAVRay-windows
          path: dist

      - name: "Версия, канал и корень доверия"
        if: steps.gate.outputs.enabled == 'true'
        run: |
          ver="${GITHUB_REF_NAME#v}"
          case "$ver" in *-*) channel=beta ;; *) channel=stable ;; esac
          echo "VER=$ver" >> "$GITHUB_ENV"
          echo "CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "SETUP_NAME=LAVRay-$ver-x64-setup.exe" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json, sys
          doc = json.load(open("core/cmd/lavray-core/root.json", encoding="utf-8"))
          if "signed" not in doc:
              sys.exit("core/cmd/lavray-core/root.json — заглушка: подписать релиз нечем, положите root.json после церемонии ключей (docs/UPDATE-SYSTEM.md)")
          PY

      - name: "updsign: сборка утилиты"
        if: steps.gate.outputs.enabled == 'true'
        working-directory: core
        run: go build -o ../updsign ./cmd/updsign

      # Токен передаётся заголовком http.extraheader, а не в адресе remote: так он
      # не попадает ни в .git/config клона, ни в сообщения git.
      - name: "meta/: текущее состояние gh-pages"
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          remote="https://github.com/${GITHUB_REPOSITORY}.git"
          if git -c "http.extraheader=AUTHORIZATION: basic $auth" ls-remote --exit-code --heads "$remote" gh-pages >/dev/null 2>&1; then
            git -c "http.extraheader=AUTHORIZATION: basic $auth" clone --depth 1 --branch gh-pages "$remote" pages
          else
            mkdir pages && git -C pages init -q -b gh-pages && git -C pages remote add origin "$remote"
          fi
          mkdir -p pages/meta
          cp core/cmd/lavray-core/root.json pages/meta/root.json

      - name: "Заметки релиза"
        if: steps.gate.outputs.enabled == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          path = f"docs/RELEASE-NOTES-windows-v{os.environ['VER']}.md"
          text = open(path, encoding="utf-8").read()[:4000] if os.path.exists(path) else ""
          json.dump({"ru": text} if text else {}, open("notes.json", "w", encoding="utf-8"), ensure_ascii=False)
          PY

      # Наборы маршрутов и гео-данные идут в манифест, только если в репозитории есть
      # входы: release-data/presets/<id>.json и/или release-data/geo/{geoip,geosite}/*.srs.
      # Нет входов — шаги ниже пропускаются, манифест несёт одно приложение.
      - name: "Наборы и гео: входы"
        id: data
        if: steps.gate.outputs.enabled == 'true'
        run: |
          presets=false; geo=false
          if ls release-data/presets/*.json >/dev/null 2>&1; then presets=true; fi
          if [ -d release-data/geo ]; then geo=true; fi
          echo "presets=$presets" >> "$GITHUB_OUTPUT"
          echo "geo=$geo" >> "$GITHUB_OUTPUT"
          if [ "$presets" = false ] && [ "$geo" = false ]; then
            echo "::notice title=Наборы и гео пропущены::нет release-data/presets/*.json и release-data/geo: в манифест попадает только приложение"
          fi

      - name: "Гео: упаковка (updsign geo-pack)"
        if: steps.gate.outputs.enabled == 'true' && steps.data.outputs.geo == 'true'
        run: |
          mkdir -p build
          ./updsign geo-pack -in release-data/geo -out build/geo.zip

      # Версия не новее уже опубликованной в канале, а ревизия набора ниже
      # опубликованной — отказ (-published-dir). Файлы данных кладутся в dist под
      # своими именами на источнике: их проверяет verify (-assets dist) и загружает
      # публикация в релиз.
      - name: "Подпись манифеста (ключи manifest и artifact)"
        if: steps.gate.outputs.enabled == 'true'
        env:
          LAVRAY_MANIFEST_KEY: ${{ secrets.LAVRAY_MANIFEST_KEY }}
          LAVRAY_ARTIFACT_KEY: ${{ secrets.LAVRAY_ARTIFACT_KEY }}
          DATA_PRESETS: ${{ steps.data.outputs.presets }}
          DATA_GEO: ${{ steps.data.outputs.geo }}
        run: |
          data=()
          if [ "$DATA_PRESETS" = true ]; then data+=(-presets-dir release-data/presets); fi
          if [ "$DATA_GEO" = true ]; then data+=(-geo-zip build/geo.zip); fi
          if [ "${#data[@]}" -gt 0 ]; then data+=(-data-prefix "v$VER/" -data-out dist); fi
          ./updsign manifest -key env:LAVRAY_MANIFEST_KEY -artifact-key env:LAVRAY_ARTIFACT_KEY \
            -product lavray-windows -channel "$CHANNEL" -version "$VER" -notes notes.json \
            -published-dir pages/meta \
            -asset "windows-x64=v$VER/$SETUP_NAME=dist/$SETUP_NAME" \
            "${data[@]}" \
            -out "pages/meta/manifest-$CHANNEL.json"

      - name: "Подпись sources.json (ключ manifest)"
        if: steps.gate.outputs.enabled == 'true'
        env:
          LAVRAY_MANIFEST_KEY: ${{ secrets.LAVRAY_MANIFEST_KEY }}
        run: ./updsign sources -key env:LAVRAY_MANIFEST_KEY -in scripts/release/sources.draft.json -out pages/meta/sources.json

      - name: "Подпись timestamp.json (ключ timestamp)"
        if: steps.gate.outputs.enabled == 'true'
        env:
          LAVRAY_TIMESTAMP_KEY: ${{ secrets.LAVRAY_TIMESTAMP_KEY }}
        run: ./updsign timestamp -key env:LAVRAY_TIMESTAMP_KEY -dir pages/meta -out pages/meta/timestamp.json

      - name: "Подпись установщика .minisig (ключ artifact)"
        if: steps.gate.outputs.enabled == 'true'
        env:
          LAVRAY_ARTIFACT_KEY: ${{ secrets.LAVRAY_ARTIFACT_KEY }}
        run: |
          serial=$(python3 -c "import json; print(json.load(open('pages/meta/manifest-$CHANNEL.json'))['signed']['serial'])")
          ./updsign artifact -key env:LAVRAY_ARTIFACT_KEY -file "dist/$SETUP_NAME" -product lavray-windows \
            -channel "$CHANNEL" -version "$VER" -serial "$serial"

      # Проверяется только выпускаемый канал: просроченный манифест соседнего не мешает.
      - name: "updsign verify (до публикации)"
        if: steps.gate.outputs.enabled == 'true'
        run: ./updsign verify -root core/cmd/lavray-core/root.json -dir pages/meta -channel "$CHANNEL" -assets dist -product lavray-windows

      - name: "Публикация meta/ в gh-pages и .minisig в релиз"
        if: steps.gate.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          gh release upload "$GITHUB_REF_NAME" "dist/$SETUP_NAME.minisig" --clobber
          shopt -s nullglob
          data=(dist/presets-*.json dist/geo-*.zip)
          if [ "${#data[@]}" -gt 0 ]; then gh release upload "$GITHUB_REF_NAME" "${data[@]}" --clobber; fi
          git -C pages config user.name "github-actions[bot]"
          git -C pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C pages add meta
          git -C pages commit -m "meta: $GITHUB_REF_NAME ($CHANNEL)" || { echo "метаданные не изменились"; exit 0; }
          git -C pages -c "http.extraheader=AUTHORIZATION: basic $auth" push origin gh-pages
