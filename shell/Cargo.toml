[package]
name = "lavray-shell"
version = "0.9.3"
description = "LAVRay desktop shell (Tauri 2)"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[lib]
name = "lavray_shell"

# Зависимости пинятся по semver-минорным версиям (tauri = "2" — по заданию).
[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
# Внешние ссылки (target=_blank) в системный браузер; схемы — в capabilities (T-58).
tauri-plugin-opener = "2"
# T-82: размер, место и развёрнутость окна между запусками (видимость — нет:
# `--tray` и «Запускать свёрнутым» решает window_policy).
tauri-plugin-window-state = "2"
# T-82: системные уведомления и глобальное сочетание «подключить/отключить».
# JS-права плагинов в capabilities не выдаются: вызов только из команд оболочки.
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
# T-82: системный диалог «Сохранить как» (запись файла — только по пути из диалога).
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# CSPRNG для auth-токена §3.2 (32 байта). getrandom 0.3.4 УЖЕ в дереве
# (транзитивно через tauri) — прямая зависимость не добавляет пакетов в lock.
getrandom = "0.3"
# SHA-256 ядра (T-44). sha2 0.10.9 уже в дереве (через tauri): Cargo.lock
# получает только ссылку из lavray-shell, новых пакетов нет.
sha2 = "0.10"
# Быстрый путь strip_ansi (поиск ESC) и разбор строк пайпов ядра. memchr 2.8.3
# УЖЕ в дереве (транзитивно): Cargo.lock получает только ссылку из lavray-shell.
memchr = "2"

[target.'cfg(unix)'.dependencies]
# PDEATHSIG SIGKILL и kill(2) по pgid (§3.3, LNB-09); process-группа — std
# `CommandExt::process_group`. libc 0.2.191 УЖЕ в дереве (транзитивно).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job Object KILL_ON_JOB_CLOSE + TerminateProcess по хэндлу (§3.3/§5).
# windows-sys 0.61.2 УЖЕ в дереве (транзитивно через tauri) — новая прямая
# зависимость не добавляет пакетов в lock, только активирует фичи.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # F5: WinINET-уведомление об изменении прокси (InternetSetOption);
  # T-82: прокси отдельного подключения (INTERNET_PER_CONN_OPTION_LISTW)
  "Win32_Networking_WinInet",
  # T-82: записи телефонной книги RAS/VPN (RasEnumEntriesW) для прокси
  # каждого подключения
  "Win32_NetworkManagement_Rras",
  # S-02: OEM-кодовая страница (GetOEMCP) и перекодировка вывода reg.exe
  # (MultiByteToWideChar)
  "Win32_Globalization",
  # T-81: перезапуск от администратора — ShellExecuteExW (глагол runas;
  # структуре SHELLEXECUTEINFOW нужен HKEY из Win32_System_Registry),
  # CoInitializeEx для вызова вне потока окна, SW_SHOWNORMAL
  "Win32_System_Com",
  "Win32_System_Registry",
  # T-82 (ревью): SID пользователя из токена (ConvertSidToStringSidW)
  "Win32_Security_Authorization",
  # общий файл настроек UI: CreateFileW с явным дескриптором безопасности
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # T-75: список процессов (ToolHelp) — ждать выход повышенного установщика,
  # когда его хэндл из-за уровня целостности не открыть
  "Win32_System_Diagnostics_ToolHelp",
  # T-77: снимок экрана для QR (BitBlt, GetDIBits)
  "Win32_Graphics_Gdi",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

# Релизная сборка: тонкий LTO и один codegen-unit. Без strip и panic=abort.
[profile.release]
lto = "thin"
codegen-units = 1
