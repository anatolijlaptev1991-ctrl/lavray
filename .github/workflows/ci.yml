# ============================================================================
# ci.yml — главный репозиторий lavray: контракт, дизайн, пресеты
# ============================================================================
# Подмножество черновика docs/stage3/ci/lavray.yml, исполнимое на текущем
# состоянии (контракт + дизайн + пресеты). Джобы go/rust/node/ui подключаются
# по мере появления кода W1–W8 (core-port-plan). Правила: permissions read
# (LNB-30), пин ОС раннера, без секретов.
name: lavray-ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: lavray-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  # --------------------------------------------------------------------------
  # proto: контракт UI<->ядро (proto/lavray.proto; buf.yaml — пин конфига)
  # --------------------------------------------------------------------------
  proto:
    runs-on: ubuntu-24.04 # ПИН ОС раннера: обновлять сознательно
    steps:
      - uses: actions/checkout@v4 # при переходе в прод пинить по SHA
      - uses: bufbuild/buf-setup-action@v1
        with:
          buf_version: "1.75.0" # пин версии buf
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf format (проверка, без записи)
        working-directory: proto
        run: buf format -d --exit-code lavray.proto
      - name: buf build
        working-directory: proto
        run: buf build -o /dev/null
      # breaking против main включается после первого мержа контракта
      # (baseline) — отдельным коммитом, чтобы не блокировать начальный пуш.

  # --------------------------------------------------------------------------
  # design: приёмочные скрипты, не требующие браузера (полный a11y_sweep и
  # kbd_probe с Playwright подключаются в W-пакетах с UI-кодом)
  # --------------------------------------------------------------------------
  design:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium
      - name: Установка Playwright + Chromium
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: "i18n_check (0 ошибок / 0 предупреждений)"
        run: python design/tools/i18n_check.py
      - name: token_contrast (все PASS)
        run: python design/tools/token_contrast.py

  # --------------------------------------------------------------------------
  # presets: встроенные пресеты (дымовая проверка схемы; golden-тесты Go — W3)
  # --------------------------------------------------------------------------
  presets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Пресеты: JSON валиден, обязательные поля, 5 языков"
        run: |
          python - <<'EOF'
          import json, glob, sys
          langs = {"ru", "zh", "en", "es", "de"}
          ok = True
          files = [f for f in glob.glob("presets/*.json") if not f.endswith(".source.json")]
          assert files, "встроенные пресеты не найдены"
          for f in sorted(files):
              d = json.load(open(f, encoding="utf-8"))
              miss = {"$schema","id","name","builtin","revision","version","description","dns","routing"} - set(d)
              if miss:
                  print(f"FAIL {f}: нет полей {sorted(miss)}"); ok = False; continue
              if d["builtin"] is not True:
                  print(f"FAIL {f}: builtin != true"); ok = False
              if not isinstance(d["revision"], int) or d["revision"] < 1:
                  print(f"FAIL {f}: revision должен быть int >= 1"); ok = False
              dl = set(d["description"])
              if dl != langs:
                  print(f"FAIL {f}: description: языки {sorted(dl)} != {sorted(langs)}"); ok = False
              print(f"ok {f}: rev {d['revision']}")
          sys.exit(0 if ok else 1)
          EOF

  # --------------------------------------------------------------------------
  # go: ядро core/ (модель, хранилище, импортёр). Полная матрица core-гейтов
  # (sing-box, golden G01+) подключается в W4–W8.
  # --------------------------------------------------------------------------
  go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: gofmt (форматирование)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -timeout 120s
      - name: "go test: sing-box check golden (тег singbox_check)"
        # Полная проверка golden-эталонов реальным sing-box (форк 628a9ed):
        # box.New + Close. Локально без сети к прокси — выключена тегом;
        # CI-сеть качает форк через proxy.golang.org (публичное зеркало).
        run: go test -tags singbox_check ./internal/cfgbuild/ -run TestGoldenSingBoxCheck -count=1 -timeout 300s
        env:
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
      - name: go build
        run: go build ./...

  # --------------------------------------------------------------------------
  # core-run: РЕАЛЬНАЯ сборка ядра с работающим sing-box (тег singbox_run).
  # Без этого «Подключиться» в приложении = NopRunner (ничего не подключает).
  # Сеть CI скачивает форк и его зависимости; локально это недостижимо (DPI).
  # --------------------------------------------------------------------------
  core-run:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: Зависимости раннера (форк sing-box)
        env:
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
        run: |
          go get github.com/anatolijlaptev1991-ctrl/sing-box@v1.14.2-0.20260916133904-628a9ed70b12 || true
          go mod tidy
      - name: Сборка с реальным раннером (singbox_run + quic)
        env:
          CGO_ENABLED: '0'
          GOFLAGS: -mod=mod
        run: |
          go build -tags "singbox_run with_quic" -o /tmp/lavray-core ./cmd/lavray-core/
          ls -la /tmp/lavray-core
      - name: Smoke - ядро поднимается, healthz и auth отвечают
        shell: bash
        run: |
          set -euo pipefail
          DATA=$(mktemp -d)
          TOKEN="ci-test-token-0123456789abcdef0123"
          echo "$TOKEN" | /tmp/lavray-core serve --listen-socket 127.0.0.1:0 --data "$DATA" > /tmp/core.log 2>&1 &
          CORE_PID=$!
          READY=""
          for i in $(seq 1 60); do
            READY=$(grep -o "LAVRAY_CORE_READY tcp://[0-9.]*:[0-9]*" /tmp/core.log | head -1 || true)
            if [ -n "$READY" ]; then break; fi
            sleep 0.25
          done
          if [ -z "$READY" ]; then echo "core did not become ready"; cat /tmp/core.log; exit 1; fi
          PORT="${READY##*:}"
          echo "core listening on port $PORT"
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/healthz")
          echo "healthz=$HEALTH"
          NOAUTH=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:$PORT/lavray.v1.CoreService/GetStatus")
          echo "no-auth=$NOAUTH"
          STATUS=$(curl -s -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -d "{}" "http://127.0.0.1:$PORT/lavray.v1.CoreService/GetStatus")
          echo "status=$STATUS"
          kill $CORE_PID || true
          test "$HEALTH" = "200"
          test "$NOAUTH" = "401"
          echo "$STATUS" | grep -q "state"
