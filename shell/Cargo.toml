[package]
name = "lavray-shell"
version = "0.1.0"
description = "LAVRay desktop shell (Tauri 2)"
edition = "2021"
publish = false

[lib]
name = "lavray_shell"

# Зависимости пинятся по semver-минорным версиям (tauri = "2" — по заданию).
[dependencies]
tauri = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[build-dependencies]
tauri-build = "2"
