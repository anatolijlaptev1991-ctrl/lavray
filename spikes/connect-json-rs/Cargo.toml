[package]
name = "connect-json-spike"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false
description = "Спайк R0-C: минимальный Connect-слой (JSON) на hyper"

# Отдельный workspace: спайк не входит ни в shell/, ни в будущий rust/.
[workspace]

[lib]
name = "connect_spike"
path = "src/lib.rs"

[[bin]]
name = "connect-spike"
path = "src/main.rs"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time", "io-util", "io-std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
