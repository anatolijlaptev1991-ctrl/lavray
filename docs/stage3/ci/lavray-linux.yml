# ============================================================================
# ci/lavray-linux.yml — сборка Linux: .deb + AppImage, контейнеры 22.04/24.04
# ============================================================================
# ЧЕРНОВИК Этапа 3. Целевое место: репозиторий `lavray-linux` →
# .github/workflows/build.yml.
#
# Артефакты релиза (UPDATE-SYSTEM §2):
#   lavray_<ver>_amd64.deb        — для apt-репозитория (signed-by, Valid-Until)
#   LAVRay-<ver>-amd64.AppImage   — с встроенным updater (замена файла)
#   manifest-<channel>.draft.json — черновик манифеста TUF-lite; подпись —
#                                   ВНЕ CI (UPDATE-SYSTEM v2.0 §4)
#
# СТРАТЕГИЯ КОНТЕЙНЕРОВ: сборка ведётся в контейнерах ОБЕИХ LTS, чтобы
# связка glibc/libwebkit работала и на 22.04 (старейшая цель), и на 24.04.
# Итоговый .deb/AppImage собирается НА 22.04 (минимальная glibc);
# 24.04-контейнер — только smoke-тест запуска (фаза 2, закомментировано).
#
# СЕКРЕТЫ: не требуются (подпись AppImage — detached ed25519 через приватный
# ключ манифеста: TAURI_SIGNING_PRIVATE_KEY — опционально, если решим
# подписывать AppImage-обновления тем же ключом апдейтера).
# ============================================================================

name: build-linux

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [stable, beta]
        default: stable
  push:
    tags: ["v*"]

permissions:
  contents: read # LNB-30; write — только в job release ниже

env:
  RUST_TOOLCHAIN: stable # точный: shell/rust-toolchain.toml
  GO_VERSION_FILE: core/go.mod
  # ПИН linuxdeploy (AppImage-тулинг): версию проверять на releases AppImage/
  # linux-appimage; обновление — отдельным PR + пересборка эталона.
  LINUXDEPLOY_VERSION: "1-alpha-20250118"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        container: ["ubuntu:22.04", "ubuntu:24.04"]
    container:
      image: ${{ matrix.container }} # ПИН контейнеров: digest-пины добавить
                                      # при переносе в прод (docker://ubuntu@sha256:...)
    steps:
      - name: Install build deps (container)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential curl git ca-certificates xz-utils file \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libssl-dev \
            dpkg-dev desktop-file-utils
          # примечание: в 22.04 webkit-пакет тоже 4.1 (jammy-updates) — если
          # нет, собрать с libwebkit2gtk-4.0-dev в отдельной ноге матрицы.

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
        # actions/* в контейнере требуют node20 на хосте — раннер ubuntu-24.04 ок.

      # ---------- Toolchain (в контейнере свои установки) --------------------
      - name: Rust (rustup, пин toolchain из rust-toolchain.toml)
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Go (пин версии из go.mod)
        run: |
          V=$(grep '^go ' core/go.mod | awk '{print $2}')
          curl -sL "https://go.dev/dl/go${V}.linux-amd64.tar.gz" | tar -C /usr/local -xz
          echo /usr/local/go/bin >> "$GITHUB_PATH"

      # ---------- 1. Go-ядро: lavray-core (CGO_ENABLED=0) --------------------
      - name: Fetch pinned sources
        run: core/libs/get_source.sh "$RUNNER_TEMP/deps"
      - name: Build lavray-core
        working-directory: core
        env:
          NEKO_SOURCES_DIR: ${{ runner.temp }}/deps
        run: |
          VER=$(git describe --tags --always | sed 's/^v//')
          # P2-44: версия ядра из пина форка (схема 1.14.1-lav.N).
          # (working-directory: core → путь libs/, не core/core/)
          CORE_VER=$(libs/core-version.sh)
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$VER -X main.versionCore=$CORE_VER" \
            -o ../shell/bin/lavray-core ./cmd/lavray-core

      # ---------- 2. UI + Tauri (.deb) ----------------------------------------
      # P1-16: pnpm ДО setup-node (cache: pnpm иначе падает). В контейнере —
      # pnpm/action-setup требует node; ставим corepack от системного node,
      # затем setup-node с кэшем (setup-node работает и в контейнере).
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: ui/.nvmrc
          cache: pnpm
      - name: Build Tauri (deb)
        working-directory: shell
        run: |
          pnpm --dir ../ui install --frozen-lockfile
          # UI собирается через beforeBuildCommand конфига tauri.conf.json
          # (та же команда и у локальной сборки — один путь правды).
          pnpm --dir ../ui exec tauri build --bundles deb

      # ---------- 3. AppImage ---------------------------------------------------
      - name: Build AppImage (linuxdeploy, пин версии + sha256 — LNB-30)
        run: |
          mkdir -p appimage/usr/bin appimage/usr/share/applications
          cp shell/bin/lavray-core appimage/usr/bin/
          cp shell/target/release/lavray appimage/usr/bin/ || true
          cp shell/target/*/release/lavray appimage/usr/bin/
          cp design/concepts/logo/lavray.svg appimage/usr/share/icons/hicolor/scalable/apps/lavray.svg
          cat > appimage/usr/share/applications/lavray.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=LAVRay
          Exec=lavray
          Icon=lavray
          Categories=Network;
          MimeType=x-scheme-handler/lavray;
          EOF
          # ПИН linuxdeploy + обязательная проверка sha256 (P2-36): хэш
          # фиксируется в core/libs/pins/linuxdeploy.sha256 при обновлении версии.
          curl -sL -o linuxdeploy \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/${LINUXDEPLOY_VERSION}/linuxdeploy-x86_64.AppImage"
          echo "$(cat core/libs/pins/linuxdeploy.sha256)  linuxdeploy" | sha256sum -c -
          chmod +x linuxdeploy
          OUTPUT=LAVRay-$(git describe --tags --always | sed 's/^v//')-amd64.AppImage \
            ./linuxdeploy --appdir appimage --output appimage
          sha256sum *.AppImage > AppImage.sha256

      # ---------- 4. Манифест (TUF-lite v2.0) ------------------------------------
      - name: Generate draft manifest (только нога 22.04 — каноничная сборка)
        if: matrix.container == 'ubuntu:22.04'
        run: |
          # Черновик manifest-<channel>.json (serial, product, assets, sha256);
          # подпись — ВНЕ CI (UPDATE-SYSTEM v2.0 §4), публикация — ручной гейт.
          node tools/gen-manifest.mjs \
            --product lavray-linux \
            --channel "${{ inputs.channel || 'stable' }}" \
            --serial-from "$GITHUB_RUN_NUMBER" \
            --asset-deb "shell/target/release/bundle/deb/*.deb" \
            --asset-appimage "LAVRay-*-amd64.AppImage" \
            --core-version "$(core/libs/core-version.sh)" \
            --out "manifest-${{ inputs.channel || 'stable' }}.draft.json"

      # ---------- 5. Smoke-тест в 24.04-контейнере -----------------------------
      - name: "Smoke — deb устанавливается, бинарники отвечают --version"
        if: matrix.container == 'ubuntu:24.04'
        run: |
          dpkg -i shell/target/release/bundle/deb/*.deb || apt-get -f install -y
          /usr/bin/lavray-core version
          # GUI-запуск в headless-раннере невозможен — ограничиваемся ядром.

      # ---------- 6. Артефакты ---------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: lavray-linux-${{ matrix.container == 'ubuntu:22.04' && 'jammy' || 'noble' }}
          path: |
            shell/target/release/bundle/deb/*.deb
            LAVRay-*-amd64.AppImage
            AppImage.sha256
            manifest-*.draft.json
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write # узкие права только здесь (LNB-30)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lavray-linux-*
          merge-multiple: true
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" *.deb *.AppImage AppImage.sha256 manifest-*.draft.json --clobber
        # Подпись манифеста и деплой apt-репо (Packages.gz + signed-by, пул
        # из последних 2 версий — откат, UPDATE-SYSTEM §6) — ручной workflow
        # apt-publish: tools/build-apt-repo.sh; подпись метаданных — вне CI.
