# release-windows.yml — сборка Windows-артефактов LAVRay (NSIS + portable ZIP).
# Запуск: тег v* или вручную. Артефакты: установщик и ZIP с ядром внутри.
name: release-windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell

      - name: "UI: сборка"
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: "Ядро: сборка (CGO-free)"
        working-directory: core
        env:
          CGO_ENABLED: '0'
          GOPRIVATE: github.com/anatolijlaptev1991-ctrl/*
          GOFLAGS: -mod=mod
        run: |
          New-Item -ItemType Directory -Force -Path ../shell/binaries | Out-Null
          go build -trimpath -ldflags '-s -w' -o ../shell/binaries/lavray-core.exe ./cmd/lavray-core/
          Get-Item ../shell/binaries/lavray-core.exe | Select-Object Name, Length

      - name: "Оболочка: установщик NSIS"
        working-directory: shell
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles nsis

      - name: "Portable ZIP (exe + ядро + LICENSE)"
        shell: pwsh
        run: |
          $rel = 'shell\target\release'
          $dir = 'dist\LAVRay-portable'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "$rel\lavray-shell.exe" "$dir\LAVRay.exe"
          New-Item -ItemType Directory -Force -Path "$dir\binaries" | Out-Null
          Copy-Item 'shell\binaries\lavray-core.exe' "$dir\binaries\lavray-core.exe"
          Copy-Item 'LICENSE' "$dir\LICENSE"
          Compress-Archive -Path "$dir\*" -DestinationPath 'dist\LAVRay-portable-x64.zip' -Force

      - name: "Checksums SHA256"
        shell: pwsh
        run: |
          $files = Get-ChildItem dist -Recurse -File | Where-Object { $_.Extension -in '.exe','.zip' }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LAVRay-windows
          path: |
            shell/target/release/bundle/nsis/*.exe
            dist/LAVRay-portable-x64.zip
            dist/SHA256SUMS.txt

      - name: "Прикрепить к релизу основного репо (при теге)"
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            shell/target/release/bundle/nsis/*.exe
            dist/LAVRay-portable-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      # Пользователь скачивает Windows-сборку из платформенного репозитория —
      # дублируем ассеты туда же (нужен секрет PLATFORM_REPO_TOKEN: PAT с
      # правом contents:write на lavray-windows; GITHUB_TOKEN кросс-репо
      # релизы не создаёт).
      - name: "Релиз в lavray-windows (при теге, если задан токен)"
        if: startsWith(github.ref, 'refs/tags/') && env.PLATFORM_REPO_TOKEN != ''
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
        shell: bash
        run: |
          gh release view "$GITHUB_REF_NAME" --repo anatolijlaptev1991-ctrl/lavray-windows >/dev/null 2>&1             && gh release upload "$GITHUB_REF_NAME"                  shell/target/release/bundle/nsis/*.exe                  dist/LAVRay-portable-x64.zip dist/SHA256SUMS.txt                  --repo anatolijlaptev1991-ctrl/lavray-windows --clobber             || gh release create "$GITHUB_REF_NAME"                  shell/target/release/bundle/nsis/*.exe                  dist/LAVRay-portable-x64.zip dist/SHA256SUMS.txt                  --repo anatolijlaptev1991-ctrl/lavray-windows                  --title "LAVRay $GITHUB_REF_NAME для Windows"                  --notes-file ../_release_notes_windows.md
